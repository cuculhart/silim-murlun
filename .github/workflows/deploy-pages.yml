name: CI & Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Pages 公開は手動のみ — Pages 設定が整い次第 push トリガーへ

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w silim-app
      # Pages 固有のステップは手動デプロイ時のみ（Pages 未有効化のため
      # push/PR ではスキップ — 有効化後も deploy job と同じ条件に揃える）
      - uses: actions/configure-pages@v6
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
